name: Render Ricks Clips — Nokia Satellite

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      quality:
        description: "Render quality"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Create placeholder assets
        run: |
          mkdir -p public/assets/models public/assets/sfx public/assets/music
          node scripts/generate-assets.js

      - name: Render video
        run: |
          if [ "${{ github.event.inputs.quality }}" = "preview" ]; then
            npm run render:preview
          else
            npm run render
          fi

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ricks-clips-nokia-video
          path: out/video.mp4
          retention-days: 30

      - name: Upload preview artifact
        if: github.event.inputs.quality == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: ricks-clips-nokia-preview
          path: out/preview.mp4
          retention-days: 7
